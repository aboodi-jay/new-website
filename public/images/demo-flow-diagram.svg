<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">
  <rect width="640" height="260" rx="10" fill="#181825"/>

  <g font-family="Jost, sans-serif" font-size="13" fill="#cdd6f4">
    <rect x="30" y="90" width="130" height="60" rx="8" fill="#313244" stroke="#585b70"/>
    <text x="95" y="115" text-anchor="middle">Attacker</text>
    <text x="95" y="133" text-anchor="middle" font-size="11" fill="#9399b2">(you)</text>

    <rect x="255" y="90" width="130" height="60" rx="8" fill="#313244" stroke="#585b70"/>
    <text x="320" y="115" text-anchor="middle">Login API</text>
    <text x="320" y="133" text-anchor="middle" font-size="11" fill="#9399b2">/api/reset</text>

    <rect x="480" y="90" width="130" height="60" rx="8" fill="#45283b" stroke="#f38ba8"/>
