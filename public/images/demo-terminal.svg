<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <rect width="640" height="320" rx="10" fill="#181825"/>
  <rect width="640" height="34" rx="10" fill="#313244"/>
  <rect y="24" width="640" height="10" fill="#313244"/>
  <circle cx="20" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="64" cy="17" r="6" fill="#a6e3a1"/>
  <text x="320" y="21" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#9399b2">aboodi@kali: ~/engagements/acme</text>

  <g font-family="JetBrains Mono, monospace" font-size="14">
    <text x="20" y="70" fill="#a6e3a1">$ nmap -sV -p- 10.10.14.22</text>
    <text x="20" y="96" fill="#cdd6f4">PORT     STATE SERVICE VERSION</text>
    <text x="20" y="118" fill="#cdd6f4">22/tcp   open  ssh     OpenSSH 8.9</text>
    <text x="20" y="140" fill="#cdd6f4">80/tcp   open  http    nginx 1.24.0</text>
    <text x="20" y="162" fill="#f9e2af">8080/tcp open  http-proxy</text>
    <text x="20" y="196" fill="#a6e3a1">$ curl -s http://10.10.14.22:8080/api/health</text>
    <text x="20" y="218" fill="#89b4fa">{"status":"ok","debug":true}</text>
    <text x="20" y="252" fill="#a6e3a1">$ _</text>
    <rect x="55" y="240" width="9" height="16" fill="#a6e3a1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
